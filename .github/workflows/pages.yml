name: Publish CALL Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify the public site
        run: |
          cat release/site.zip.* > /tmp/site.zip
          echo "e19de8c2a7d09fd491cb936f56e42b59bcaa517b0f4bf20cfad57fad43034344  /tmp/site.zip" | sha256sum -c -
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          test -f _site/data/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
